<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorBlast</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hud">
  <div class="hud-card score-card">
    <div class="hud-label">Score</div>
    <div class="hud-val" id="score">0</div>
  </div>
  <div class="hud-card best-card">
    <div class="hud-label">Best</div>
    <div class="hud-val" id="best">0</div>
  </div>
</div>

<div id="board-wrap">
  <div id="board-bg"></div>
  <canvas id="game-cv" width="338" height="338"></canvas>
  <div id="congrats"></div>
</div>

<div id="msg"></div>
<div id="pieces-row"></div>

<div id="ghost">
  <canvas id="ghost-cv" style="opacity:.9"></canvas>
</div>

<button id="restart" onclick="initGame()">▶ Play Again</button>

<script src="game.js"></script>
</body>
</html>
